<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#121211">
<title>嘉義車站 GLT 構造邏輯與材料加工</title>
<style>
:root{--bg:#121211;--panel:#1b1b1a;--line:#34342f;--ink:#fff;--ink2:#c3c2b7;--ink3:#8e8d86;--blue:#3987e5;--aqua:#199e70;--orange:#d95926}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
body{display:grid;grid-template-rows:auto 52dvh 1fr;height:100dvh;overflow:hidden}
header{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px;display:flex;justify-content:space-between;align-items:center;gap:10px}
header .k{font-size:10.5px;letter-spacing:.14em;color:var(--ink3)}
header .t{font-size:16px;font-weight:700;line-height:1.3}
header .step{font-size:13px;color:var(--ink3);white-space:nowrap;text-align:right}
header .step b{display:block;color:var(--ink2);font-weight:500}
#stage{position:relative;touch-action:none;min-height:0}
canvas{display:block;width:100%;height:100%}
#hint{position:absolute;right:10px;bottom:8px;font-size:11px;color:var(--ink3);background:rgba(18,18,17,.7);padding:2px 8px;border-radius:10px;pointer-events:none;transition:opacity .6s}
#sheet{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0}
@media (min-width:900px){
 body{grid-template-columns:1fr calc(440px * var(--z,1));grid-template-rows:auto 1fr}
 #sheet,header,#hint{zoom:var(--z,1)}
 #cap .agenda{columns:2;column-gap:28px}
 .agenda li{break-inside:avoid}
 header{grid-column:1 / 3}
 #stage{grid-row:2;grid-column:1}
 #sheet{grid-row:2;grid-column:2;border-top:0;border-left:1px solid var(--line);border-radius:0}
}
#prog{display:flex;gap:4px;padding:12px 16px 0}
#prog i{flex:1;height:3px;border-radius:2px;background:#34342f;position:relative;overflow:hidden}
#prog i b{position:absolute;inset:0;width:0;background:var(--blue)}
#cap{flex:1;overflow-y:auto;padding:8px 16px 12px}
#cap h2{font-size:19px;line-height:1.35;margin:4px 0 6px}
#cap p{margin:0 0 10px;color:var(--ink2)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink2);margin:4px 0 8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:4px 5px;border-bottom:1px solid var(--line);color:var(--ink2);vertical-align:top}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{color:var(--ink3);font-weight:500}.tbl tr.t td{color:#fff;font-weight:700;border-bottom:0}
.tbl td.l{text-align:left}
.tbl td:first-child{white-space:nowrap}
.stack{display:grid;grid-template-columns:54px 1fr 44px;gap:8px;align-items:center;font-size:12.5px;color:var(--ink2);margin:5px 0}
.stack .bar{display:flex;height:14px;border-radius:3px;overflow:hidden;gap:2px;background:#121211}
.stack .bar i{display:block;height:100%}
.stack span:last-child{text-align:right}
#flash{font-size:13.5px;color:#fff;background:#262624;border-radius:10px;padding:8px 10px;margin:0 0 10px;min-height:20px}
#flash:empty{display:none}
.gl{display:flex;flex-direction:column;gap:6px;margin:6px 0 4px}
.gl div{border-left:3px solid #34342f;padding:4px 10px;color:var(--ink3);transition:all .3s;border-radius:0 8px 8px 0}
.gl div b{color:var(--ink2);margin-right:6px}
.gl div.on{border-left-color:var(--blue);background:#262624;color:var(--ink)}
.gl div.on b{color:#fff}
.gl div.done{color:var(--ink2)}
.note{font-size:12px;color:var(--ink3);margin-top:8px}
nav{display:grid;grid-template-columns:52px 1fr 76px 52px;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 10px);border-top:1px solid var(--line)}
nav button,#sel{height:46px;border-radius:12px;border:1px solid var(--line);background:#262624;color:var(--ink);font:inherit;font-size:15px}
#sel{padding:0 12px;appearance:none;-webkit-appearance:none;text-align:center}
nav button:active{background:#34342f}
.agenda{counter-reset:a;list-style:none;padding:0;margin:6px 0;columns:1}
.agenda li{counter-increment:a;padding:3px 0;color:var(--ink2);border-bottom:1px solid var(--line)}
.agenda li::before{content:counter(a,decimal-leading-zero);color:var(--ink3);margin-right:10px;font-variant-numeric:tabular-nums}
.agenda li.h{color:#fff;font-weight:700;border-bottom:0;margin-top:8px}.agenda li.h::before{content:'';margin:0}
.agenda li.h{counter-increment:none}
.agenda li[data-go]{cursor:pointer;transition:color .15s,background .15s;border-radius:6px}
.agenda li[data-go]:hover{color:#fff;background:#262624}
.agenda li[data-go]::after{content:' ›';color:var(--ink3)}
header .t{cursor:pointer}
#sum{position:absolute;inset:0;padding:10px 14px;overflow:auto;opacity:0;pointer-events:none;transition:opacity .6s;background:rgba(18,18,17,.55)}
#sum.on{opacity:1;pointer-events:auto}
#sum .kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
#sum .kpi div{background:#1f1f1d;border:1px solid var(--line);border-radius:10px;padding:8px 10px;line-height:1.3}
#sum .kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
#sum .kpi span{font-size:12px;color:var(--ink3)}
#sum h3,#cap h3{font-size:14px;margin:10px 0 2px;color:#fff}#sum h3 small,#cap h3 small{color:var(--ink3);font-weight:400;margin-left:8px}
#sum .g2{display:grid;grid-template-columns:1fr 1fr;gap:0 22px}
#sum .sec{opacity:0;transform:translateY(8px)}#sum.on .sec{animation:sin .6s ease-out forwards}
@keyframes sin{to{opacity:1;transform:none}}
#sum .tbl{font-size:12.5px;margin:2px 0 4px}#sum .tbl th,#sum .tbl td{padding:3px 5px}#sum .kpi b{white-space:nowrap}#sum .note{margin-top:2px}
.tbl td.hi{color:#fff;font-weight:700}
@media (min-width:900px){#sum{zoom:calc(var(--z,1)*.95);padding:12px 22px}#sum .kpi{grid-template-columns:repeat(3,1fr);gap:8px 10px}#sum .kpi div{display:flex;align-items:baseline;gap:10px;padding:7px 12px}#sum .kpi b{font-size:21px}}
</style>
</head>

 if(a.length===1&&base.a.length===1){user.yaw=base.yaw+(a[0].x-base.a[0].x)*.35;user.el=base.el+(a[0].y-base.a[0].y)*.3}else if(a.length>1&&base.d){user.zoom=clamp(base.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/base.d,.4,10)}});

 [...prog.children].forEach((e,j)=>e.firstChild.style.width=j<si?'100%':j===si?(u*100)+'%':'0');
 requestAnimationFrame(frame)}
