const say=t=>{$('err').textContent=t};
const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function ss(fn){try{return fn(sessionStorage)}catch(e){return null}}
async function derive(pw){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},true,['decrypt'])}
async function dec(key,buf){buf=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.subarray(0,12)},key,buf.subarray(12))}
async function show(key,silent){
 let html;
 try{html=new TextDecoder().decode(await dec(key,u8(BLOB)))}
 catch(e){ss(s=>s.removeItem(SK));if(!silent)say(e&&e.name==='OperationError'?'密碼不正確':'解密失敗：'+(e&&e.name||e));$('go').disabled=false;return false}
 try{const raw=await crypto.subtle.exportKey('raw',key);ss(s=>s.setItem(SK,b64(raw)))}catch(e){}
 window.__huxiKey=key;window.__huxiDec=dec;
 await loaded; // 頁面還在解析時 document.open 會被忽略、內容變成附加，所以等 load 之後再換頁
 document.open();document.write(html);document.close();return true;
}
if(!(window.crypto&&crypto.subtle)){
 say('此瀏覽器無法解密：請用 https 網址開啟，並使用新版 Chrome／Edge／Safari／Firefox。');
 $('go').disabled=true;$('pw').disabled=true;
}else{
 $('f').onsubmit=async e=>{e.preventDefault();$('go').disabled=true;say('解密中…');
  try{await show(await derive($('pw').value))}catch(err){say('解密失敗：'+(err&&err.name||err));$('go').disabled=false}};
 const saved=ss(s=>s.getItem(SK));
 if(saved){say('解密中…');crypto.subtle.importKey('raw',u8(saved),'AES-GCM',true,['decrypt']).then(k=>show(k,true)).then(ok=>{if(!ok)say('')}).catch(()=>{ss(s=>s.removeItem(SK));say('')})}
}
})();
</script></body></html>
