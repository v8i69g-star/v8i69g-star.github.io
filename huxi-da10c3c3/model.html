 return crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(SALT),iterations:ITER,hash:'SHA-256'},k,{name:'AES-GCM',length:256},false,['decrypt'])}
async function dec(key,buf){return crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},key,buf.slice(12))}
async function open_(pw,silent){
 try{const key=await derive(pw);const html=new TextDecoder().decode(await dec(key,u8(BLOB)));
  try{sessionStorage.setItem('huxi_pw',pw)}catch(e){}
  window.__huxiKey=key;window.__huxiDec=dec;
  document.open();document.write(html);document.close();
 }catch(e){try{sessionStorage.removeItem('huxi_pw')}catch(_){};if(!silent)document.getElementById('err').textContent='密碼不正確'}}
document.getElementById('f').onsubmit=e=>{e.preventDefault();document.getElementById('err').textContent='解密中…';open_(document.getElementById('pw').value)};
let saved=null;try{saved=sessionStorage.getItem('huxi_pw')}catch(e){}
if(saved)open_(saved,true);
</script></body></html>
